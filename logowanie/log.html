<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <link rel="stylesheet" href="log.css">
    <script src="log.js"></script> 
</head>
<body>
    <div class="login-container">

    <div id="arrow" onclick="back()"><img src="arrow.png" width="20px" height="20px" alt="wróć do strony głównej"></div>

    <h1>Logowanie</h1>

    <input type="email" placeholder="E-mail">

    <input type="password" placeholder="Hasło">

    <div class="reset" onclick="reset()">zapomniałeś hasła?</div>

    <button class="login-btn">Zaloguj</button>

    

    <button class="register-btn" onclick="goToLogin()">
        NIE MASZ KONTA? ZAREJESTRUJ SIĘ
    </button>
</div>
</body>
</html>
