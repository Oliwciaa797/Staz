<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - WiseUp</title>
    <link rel="stylesheet" href="log.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="log.js" defer></script>
    <script src="/toast.js" defer></script>
</head>
<body>
    <div class="login-container">

    <div id="arrow" onclick="back()"><img src="arrow.png" width="20px" height="20px" alt="wróć do strony głównej"></div>
    <h1>Logowanie</h1>

    <input type="email" id="email" placeholder="E-mail">

    <input type="password" id="password" placeholder="Hasło">
    <p id="loginError" class="error"></p>

    <div id="reset" onclick="reset()">zapomniałeś hasła?</div>

    <button id="loginBtn" class="login-btn">Zaloguj</button>

    <div id="status"></div>

    <button class="register-btn" onclick="goToLogin()">
        NIE MASZ KONTA? ZAREJESTRUJ SIĘ!
    </button>
</div>
</body>
