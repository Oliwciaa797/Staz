<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="stylesheet" href="video.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="video.js"></script>
    <title>Nazwa strony</title>
</head>
<body>
    <header>
        <div class="top">

            <div id="menuBtn" onclick="toggleMenu()">
                ☰
            </div>
    
            <div id="sidebar">
                <a href="../strona startowa/start.html">Strona Startowa</a>
                <a href="../logowanie/log.html">Logowanie</a>
                <a href="../Zapisane materiały/zapis.html">Zapisane materiały</a>
                <a href="../Profil/prof.html">Profil</a>
            </div>

            <h1 class="logo">Nazwa strony</h1>

            <button class="login-btn" onclick="goToLogin()">
                Zaloguj
            </button>
        </div>
    </header>

    <main>
        <div class="middleSection">
            <div class="video-container">

                <iframe
                    id="youtubeVideo"
                    width="900"
                    height="500"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="sidepanel">

                <div class="buttons">
                    <button id="ainotes" onclick="showTab('generated')">Notatki AI</button>
                    <button id="personalnotes" onclick="showTab('personal')">Własne notatki</button>
                    <button id="quiztab" onclick="showTab('quiz')">Quiz</button>
                </div>
                <div class="sidepanelcontent">
                    <div id="generated" class="tab">
                        <button id="gennotes" onclick="generateNotes()">
                            Generuj notatki
                        </button>
                        <div id="notesContent"></div>
                    </div>
                    <div id="personal" class="tab">Własne notatki</div>
                    <div id="quiz" class="tab">halo</div>
                </div>
            </div>
    </div>
    <section class="reviews-grading">
    <h2>Recenzje i Ocena</h2>
    
    <!-- Overall Grade -->
    <div class="grade-summary">
        <div class="grade-box">
            <p class="grade-letter">A</p>
            <p class="grade-avg">Średnia ocena: 4.5/5 ⭐</p>
            <p class="review-count">245 opinii</p>
        </div>
    </div>
    
    <!-- User Rating Input -->
    <div class="user-review">
        <h3>Twoja ocena</h3>
        <div class="rating-stars">
            <span class="star" onclick="setRating(1)">⭐</span>
            <span class="star" onclick="setRating(2)">⭐</span>
            <span class="star" onclick="setRating(3)">⭐</span>
            <span class="star" onclick="setRating(4)">⭐</span>
            <span class="star" onclick="setRating(5)">⭐</span>
        </div>
        
        <select id="gradeSelect" class="grade-input">
            <option value="">Wybierz ocenę</option>
            <option value="A">A - Doskonały</option>
            <option value="B">B - Bardzo dobry</option>
            <option value="C">C - Dobry</option>
            <option value="D">D - Zadowalający</option>
            <option value="F">F - Niedostateczny</option>
        </select>
        
        <textarea id="reviewText" placeholder="Dodaj swoją opinię..."></textarea>
        <button onclick="submitReview()">Prześlij opinię</button>
    </div>
    
    <!-- Reviews List -->
    <div class="reviews-list">
        <h3>Wszystkie opinii</h3>
        <div id="reviewsContainer"></div>
    </div>
</section>
</main>

</body>
</html>
