<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazwa strony</title>
    <link rel="stylesheet" href="video.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="video.js" defer></script>
</head>
<body>
    <header>
        <div class="top">

            <div id="menuBtn" onclick="toggleMenu()">
                ☰
            </div>
    
            <div id="sidebar">
                <a href="../strona startowa/start.html">Strona Startowa</a>
                <a href="../logowanie/log.html">Logowanie</a>
                <a href="../materialy/not.html">Zapisane materiały</a>
                <a href="../Profil/prof.html">Profil</a>
            </div>

            <h1 class="logo" onclick="back()">Nazwa strony</h1>

            <div id="userArea" class="user-area">

            <div class="user-info">
                <img src="avatar.png" class="avatar">
                <span>Witaj, </span>
            </div>

        <div class="user-menu">

            <a href="../Profil/prof.html">Profil</a>

            <a href="../wylogowywanie/logout.html">Wyloguj się</a>

        </div></div></div>
    </header>

    <main>
        <div class="middleSection">
            <div class="video-container">

                <iframe
                    id="youtubeVideo"
                    width="900"
                    height="500"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="sidepanel">

                <div class="buttons">
                    <button id="ainotes" onclick="showTab('generated')">Notatki AI</button>
                    <button id="personalnotes" onclick="showTab('personal')">Własne materiały</button>
                    <button id="quiztab" onclick="showTab('quiz')">Quiz</button>
                </div>
                <div class="sidepanelcontent">
                    <div id="generated" class="tab">
                        <button id="gennotes" onclick="generateNotes()">
                            Generuj notatki
                        </button>
                        <div id="notesContent"></div>
                    </div>

                    <!-- ===== WŁASNE MATERIAŁY ===== -->
                    <div id="personal" class="tab">

                        <div class="sub-tabs">
                            <button class="sub-tab-btn active" data-subtab="personalNotes" onclick="showSubTab('personalNotes')">Notatki</button>
                            <button class="sub-tab-btn" data-subtab="personalQuizy" onclick="showSubTab('personalQuizy')">Quizy</button>
                        </div>

                        <div id="personalNotes" class="sub-tab-panel active">
                            <div class="note-card" data-id="${note.id}"></div>
                            <button id="addNoteBtn" onclick="createPersonalNote()">+ Dodaj notatkę</button>
                            <div id="personalNotesContainer">
                                <p>Brak notatek.</p>
                            </div>
                        </div>

                        <div id="personalQuizy" class="sub-tab-panel">
                            <button id="addQuizBtn" onclick="window.location.href='../kreator quizow/quiz.html'">+ Nowy quiz</button>
                            <div id="personalQuizyContainer">
                                <p>Brak quizów.</p>
                            </div>
                        </div>

                    </div>

                    <div id="quiz" class="tab">
                        <h3>Quiz</h3>
                        <p>Tutaj będzie quiz generowany automatycznie.</p>
                    </div>
                </div>
            </div>
    </div>
    <section class="reviews-grading">
    <h2>Recenzje i Ocena</h2>
    
    <!-- Overall Grade -->
    <div class="grade-summary">
        <div class="grade-box">
            <p class="grade-avg">Średnia ocena: 4.5/5 ⭐</p>
            <p class="review-count">245 opinii</p>
        </div>
    </div>
    
    <!-- User Rating Input -->
    <div class="user-review">
        <h3>Twoja ocena</h3>
        <div class="rating-stars">
            <span class="star" onclick="setRating(1)">⭐</span>
            <span class="star" onclick="setRating(2)">⭐</span>
            <span class="star" onclick="setRating(3)">⭐</span>
            <span class="star" onclick="setRating(4)">⭐</span>
            <span class="star" onclick="setRating(5)">⭐</span>
        </div>
        
        <textarea id="reviewText" placeholder="Dodaj swoją opinię..."></textarea>
        <div class="visibility-toggle">
        </div>
        <button onclick="submitReview()">Prześlij opinię</button>
    </div>
    
        <label for="sortReviews">Sortuj:</label>
    <select id="sortReviews" onchange="loadReviews()">
        <option value="newest">Najnowsze</option>
        <option value="oldest">Najstarsze</option>
        <option value="highest">Najwyżej ocenione</option>
        <option value="lowest">Najniżej ocenione</option>
    </select>
    
    <!-- Reviews List -->
    <div class="reviews-list">
        <h3>Wszystkie opinie</h3>
        <div id="reviewsContainer"></div>
        <div class="reviews-sort">
    </div>



<div id="reviewsContainer"></div>
    </div>
</section>
</main>

</body>
</html>
