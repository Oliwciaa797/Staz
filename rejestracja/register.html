<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    
    <div class="register-container">
    <div id="arrow" onclick="back()"><img src="arrow.png" width="20px" height="20px" alt="wróć do strony głównej"></div>
    <h1>Zarejestruj się</h1>

    <input type="email" id="email" placeholder="E-mail">

    <input type="password" id="password1" id="docel" placeholder="Hasło">
    <input type="password" id="password2" placeholder="Powtórz hasło">

    <label class="checkbox">
        <input id="check" type="checkbox">
        Zgadzam się na warunki użytkowania strony
    </label>

    <button class="register-btn" id="guzik">Zarejestruj się</button>
    <div id="status"></div>
  </div>
    
</body>
</html>
