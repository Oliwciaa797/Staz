<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozwiąż quiz - WiseUp</title>

<link rel="stylesheet" href="qu.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../toast.js"></script>
    <script src="qu.js" defer></script>
</head>
<body>

<div class="quiz-container">

    <img src="arrow.png" height="25px" width="25px" onclick="back()" class="back" alt="">
    <div class="title">
            <p style="color: #666; font-size: 15px;">Tytuł</p>
            <h1 id="quizTitle"></h1>
        </div>
        <div id="tags"></div>
        <div class="author">
            <p style="color: #666; font-size: 15px;">Autor</p>
            <div class="author-info">
            <img src="../Profil/avatar.png" alt="Profie picture" id="authorAvatar">
            <p id="author"></p>
            </div>
        </div>
    <div id="quizContent"></div>

    <button id="finishBtn">
        Zakończ quiz
    </button>

    <div id="quizResult"></div>

    <div id="content"></div>
        <div class="like-btn">
            <img src="heart.png" height="40px" width="40px" alt="zapisz"  id="likeBtn">
        </div>
</div>
<div id="materialsDrawer" class="materials-drawer">

    <div id="drawerToggle" class="drawer-toggle">
        
    </div>

    <div class="drawer-content">

        <h2>Informacje o quizie</h2>

        <p id="drawerQuizTitle"></p>

        <p id="drawerQuestionCount"></p>

        <p id="drawerScorePreview">
            Wynik pojawi się po zakończeniu.
        </p>

    </div>

</div>
</body>
</html>
