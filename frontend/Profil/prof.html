<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil użytkownika - WiseUp</title>
    <link rel="stylesheet" href="prof.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/toast.js" defer></script>
    <script src="prof.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/W (1).png">
</head>
<body>
<header>
    <div class="top">

        <div id="menuBtn">
            ☰
        </div>
  
        <div id="sidebar">
            <a href="../strona startowa/start.html">Strona Startowa</a>
            <a href="../logowanie/log.html">Logowanie</a>
            <a href="../materialy/not.html">Zapisane materiały</a>
            <a href="../Profil/prof.html">Profil</a>
            <a href="#" id="inviteFriendBtn">Dołącz znajomego</a>
            <a href="../wylogowywanie/logout.html">Wyloguj się</a>
        </div>

        <h1 onclick="back()" class="logo">WiseUp</h1>
    </div>

</header>
<div class="page">
<div class="profile-container">

    <div class="left-section">
        <div id="arrow" onclick="back()"><img src="arrow.png" width="20px" height="20px" alt="wróć do strony głównej"></div>
        <h1>Twój profil</h1>
        <div class="middleFields">
            <div class="field">
                <label>Nazwa użytkownika</label>
                <input type="text" id="username" placeholder="Wpisz nazwę użytkownika" maxlength="20">
                <span id="usernameCounter" class="char-counter">0/20</span>
            </div>

            <div class="field">
                <label>Email</label>
                <input type="email" id="email" readonly>
            </div>

            <div class="field" id="projectsField" onclick="goToProjects()">
                <label>Twoje materiały</label>
                <input type="text" id="projects" readonly>
                <img src="arrow.png" alt="arrow" id="arrowToProjects">
            </div>
        </div>

        <div class="bottom-btns">
            <div id="changePasswordBtn" class="link-btn">Zmień hasło</div>
            <div id="deleteAccountBtn" class="link-btn danger">Usuń konto</div>
            <div type="button" id="logoutBtn"><img src="logout.png" alt="logout" style="height: 20px; width: auto;"><a href="../wylogowywanie/logout.html">Wyloguj się</a></div>
        </div>
    </div>

    <div class="right-section">

        <div class="avatar" id="avatarWrapper">
            <img id="avatarImg" alt="Zdjęcie profilowe" style="display:none;">
            <span id="avatarPlaceholder">Kliknij, aby dodać zdjęcie</span>
        </div>
        <input type="file" id="avatarInput" accept=".png,.jpg,.jpeg,.webp" style="display:none;">
        <div class="saveSection">
            <button id="saveBtn">
                <span id="btnText">ZATWIERDŹ</span>
                <div class="custom-loader" id="loader"></div>
            </button>
            <div id="status"></div>
        </div>

    </div>

</div>
</div>
</body>
</html>
