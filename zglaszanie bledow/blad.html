<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zgłaszanie błędów</title>
<link rel="stylesheet" href="blad.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="blad.js" defer></script>
</head>
<body>

<div class="container">

    <h1>Zgłoś błąd</h1>

    <label>Strona</label>

    <select id="pageName">

        <option value="Strona startowa">Strona startowa</option>
        <option value="Wideo">Wideo</option>
        <option value="Quizy">Quizy</option>
        <option value="Notatki">Notatki</option>
        <option value="Profil">Profil</option>
        <option value="logowanie">Logowanie/Rejestracja</option>
        <option value="edytor">Edytor/Kreator quizów</option>
        <option value="materialy">Materiały</option>
        <option value="reset">Resetowanie hasła</option>
        <option value="usuniecie-konta">Usunięcie konta</option>
        <option value="mail">Zmiana adresu e-mail</option>
        <option value="spolcznosc">Społeczność</option>
        <option value="Problem z kontem">Problem z kontem</option>
        <option value="Inne">Inne</option>

    </select>

    <label>Rodzaj błędu</label>

    <select id="bugType">

        <option value="Wygląd">Wygląd</option>
        <option value="Nie działa">Nie działa</option>
        <option value="Błąd danych">Błąd danych</option>
        <option value="reset">Resetowanie hasła</option>
        <option value="usuniecie-konta">Usunięcie konta</option>
        <option value="mail">Zmiana adresu e-mail</option>
        <option value="Inne">Inne</option>

    </select>

    <label>Opis problemu</label>

    <textarea
        id="description"
        placeholder="Opisz problem..."
    ></textarea>

    <button onclick="sendReport()">
        Wyślij zgłoszenie
    </button>

    <div id="msg"></div>

</div>

</body>
</html>
