<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil użytkownika</title>
    <link rel="stylesheet" href="prof.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="prof.js" defer></script>
</head>
<body>
<header>
    <div class="top">

        <div id="menuBtn">
            ☰
        </div>
  
        <div id="sidebar">
            <a href="../strona startowa/start.html">Strona Startowa</a>
            <a href="../logowanie/log.html">Logowanie</a>
            <a href="../Zapisane materiały/zapis.html">Zapisane materiały</a>
            <a href="../Profil/prof.html">Profil</a>
            <a href="../wylogowywanie/logout.html">Wyloguj się</a>
        </div>

        <h1 onclick="back()" class="logo">Nazwa strony</h1>
    </div>

</header>
<div class="page">
<div class="profile-container">

    <div class="left-section">
        <div id="arrow" onclick="back()"><img src="arrow.png" width="20px" height="20px" alt="wróć do strony głównej"></div>
        <h1>Twój profil</h1>

        <div class="field">
            <label>Nazwa użytkownika</label>
            <input type="text" id="username" placeholder="Wpisz nazwę użytkownika">
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" readonly>
        </div>

        <div class="field">
        <label>Twoje materiały</label>
        <input type="text" id="projects" readonly>
        </div>


        <div id="changePasswordBtn" class="link-btn">Zmień hasło</div>
        <div id="deleteAccountBtn" class="link-btn danger">Usuń konto</div><br>
        <div type="button"><a href="../wylogowywanie/logout.html">Wyloguj się</a></div>
    </div>

    <div class="right-section">

        <div class="avatar" id="avatarWrapper">
            <img id="avatarImg" alt="Zdjęcie profilowe" style="display:none;">
            <span id="avatarPlaceholder">Kliknij, aby dodać zdjęcie</span>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none;">

        <button id="saveBtn">ZATWIERDŹ</button>

        <div id="status"></div>

    </div>

</div>
</div>
</body>
</html>
