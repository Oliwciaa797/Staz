<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmień hasło - WiseUp</title>
    <link rel="stylesheet" href="../usunkonto/usun.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="zmien.js" defer></script>
</head>
<body>

<div class="profile-container">
    <div class="left-section">
        <div id="arrow" onclick="back()">
            <img src="arrow.png" width="20px" height="20px" alt="wróć do profilu">
        </div>

        <h1>Zmień hasło</h1>

        <div class="field">
            <label>Obecne hasło</label>
            <input type="password" id="currentPassword" autocomplete="current-password">
        </div>

        <div class="field">
            <label>Nowe hasło (min. 8 znaków)</label>
            <input type="password" id="newPassword" autocomplete="new-password">
        </div>

        <div class="field">
            <label>Powtórz nowe hasło</label>
            <input type="password" id="newPassword2" autocomplete="new-password">
        </div>

        <p id="error" class="error"></p>

        <button id="changeBtn">ZATWIERDŹ</button>

        <div id="status"></div>
    </div>
</div>

</body>
</html>
