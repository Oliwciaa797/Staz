<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil użytkownika</title>
    <link rel="stylesheet" href="prof.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="prof.js" defer></script>
</head>
<body>

<div class="profile-container">

    <div class="left-section">
        <h1>Twój profil</h1>

        <div class="field">
            <label>Nazwa użytkownika</label>
            <input type="text" id="username" placeholder="Wpisz nazwę użytkownika">
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" readonly>
        </div>

        <div class="field">
            <label>Twoje projekty</label>
            <input type="text" id="projects">
        </div>

        <button type="button" id="changePasswordBtn" class="link-btn">Zmień hasło</button>
        <button type="button" id="deleteAccountBtn" class="link-btn danger">Usuń konto</button>
    </div>

    <div class="right-section">

        <div class="avatar" id="avatarWrapper">
            <img id="avatarImg" alt="Zdjęcie profilowe" style="display:none;">
            <span id="avatarPlaceholder">Kliknij, aby dodać zdjęcie</span>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none;">

        <button id="saveBtn">ZATWIERDŹ</button>

        <div id="status"></div>

    </div>

</div>

</body>
</html>
